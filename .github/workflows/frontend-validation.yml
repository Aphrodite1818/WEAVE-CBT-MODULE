name: Frontend validation

on:
  push:
    branches: [implementing-services]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    branches: [implementing-services]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build staff and student apps
        run: npm run build
