name: Windows Installer

on:
  push:
    branches: [deployment-implementation]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deployment/docker/**'
      - '.dockerignore'
      - 'deployment/manager/**'
      - 'deployment/compose.yaml'
      - 'deployment/nginx/nginx.conf'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Manager installer version
        required: true
        default: '0.1.13'
      cbt_version:
        description: CBT application version represented by the pinned image
        required: true
        default: '0.1.0'
      weave_image:
        description: Optional existing public image. Leave empty to build and publish the application from this commit.
        required: false
        default: ''
      publish:
        description: Publish/update the production and staging channel releases
        required: true
        type: boolean
        default: true
      release_notes:
        description: Short release notes
        required: false
        default: 'Weave CBT Manager 0.1.13 detects Public school networks, provides one-click trusted network approval, and automatically reconciles LAN forwarding when the host network changes.'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-tests:
    name: Manager tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: deployment/manager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Generate development build metadata
        shell: pwsh
        run: |
          @'
          ENVIRONMENT = "dev"
          WEAVE_API_BASE_URL = "http://localhost:8080"
          WEAVE_IMAGE = "ghcr.io/aphrodite1818/weave-cbt-module:sha-7604735"
          CBT_VERSION = "0.1.0"
          '@ | Set-Content src/weave_cbt_manager/generated_build.py -Encoding UTF8
      - name: Install Manager test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Manager tests
        run: python -m pytest -q
      - name: Exercise Manager self-test from source
        shell: pwsh
        run: python -m weave_cbt_manager --self-test

  app-image:
    name: Build and verify CBT application image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image repository
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.weave_image == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish application
        id: build
        if: inputs.weave_image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.repository.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=cbt-app
          cache-to: type=gha,mode=max,scope=cbt-app
      - name: Resolve immutable image and verify anonymous pull
        id: resolve
        env:
          REQUESTED_IMAGE: ${{ inputs.weave_image }}
          BUILT_IMAGE: ${{ steps.repository.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          image="${REQUESTED_IMAGE:-$BUILT_IMAGE}"
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull "$image"
          resolved=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          test -n "$resolved"
          echo "image=$resolved" >> "$GITHUB_OUTPUT"
          echo "WEAVE_IMAGE=$resolved" >> "$GITHUB_ENV"
      - name: Start the exact application shipped in the installer
        run: |
          cat > deployment/ci.env <<'EOF'
          ENVIRONMENT='stg'
          WEAVE_API_BASE_URL='https://weave-container-staging.up.railway.app'
          POSTGRES_DB='weave_cbt'
          POSTGRES_USER='weave'
          POSTGRES_PASSWORD='CI-only-credential-2026'
          DATABASE_URL='postgresql+asyncpg://weave:CI-only-credential-2026@postgres:5432/weave_cbt'
          REDIS_URL='redis://redis:6379/0'
          DEBUG='false'
          EOF
          docker compose -p weave-cbt-ci -f deployment/compose.yaml --env-file deployment/ci.env up -d --wait --wait-timeout 240
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost/staff -o /tmp/staff.html
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost/student -o /tmp/student.html
          grep -q '<html' /tmp/staff.html
          grep -q '<html' /tmp/student.html
      - name: Application diagnostics
        if: failure()
        run: docker compose -p weave-cbt-ci -f deployment/compose.yaml --env-file deployment/ci.env logs --no-color --tail 100
      - name: Stop CI services
        if: always()
        run: docker compose -p weave-cbt-ci -f deployment/compose.yaml --env-file deployment/ci.env down --volumes

  runtime-rootfs:
    name: Build WSL runtime rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate bundled Compose contract
        shell: bash
        run: |
          cat > /tmp/weave-runtime.env <<'EOF'
          ENVIRONMENT='stg'
          WEAVE_API_BASE_URL='https://weave-container-staging.up.railway.app'
          WEAVE_IMAGE='ghcr.io/aphrodite1818/weave-cbt-module:sha-7604735'
          POSTGRES_DB='weave_cbt'
          POSTGRES_USER='weave'
          POSTGRES_PASSWORD='Pass$word#2026'
          DATABASE_URL='postgresql+asyncpg://weave:Pass%24word%232026@postgres:5432/weave_cbt'
          REDIS_URL='redis://redis:6379/0'
          DEBUG='false'
          EOF
          docker compose --project-name weave-cbt-ci --file deployment/compose.yaml --project-directory deployment --env-file /tmp/weave-runtime.env config --quiet
      - name: Build dedicated WEAVE runtime
        run: docker build -f deployment/manager/runtime/distro/Dockerfile -t weave-cbt-wsl-runtime deployment/manager/runtime/distro
      - name: Export WSL root filesystem
        run: |
          id=$(docker create weave-cbt-wsl-runtime)
          docker export "$id" -o weave-runtime-rootfs.tar
          docker rm "$id"
          test -s weave-runtime-rootfs.tar
      - uses: actions/upload-artifact@v6
        with:
          name: weave-wsl-rootfs
          path: weave-runtime-rootfs.tar
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Build ${{ matrix.channel }} Windows installer
    runs-on: windows-latest
    needs: [manager-tests, runtime-rootfs, app-image]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: production
            build_env: prod
            api_url: https://api.weavecloudspace.com
            release_tag: manager-production-latest
          - channel: staging
            build_env: stg
            api_url: https://weave-container-staging.up.railway.app
            release_tag: manager-staging-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/download-artifact@v7
        with:
          name: weave-wsl-rootfs
          path: deployment/manager/runtime/distro
      - name: Resolve build identity
        id: identity
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.13' }}
          INPUT_CBT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.cbt_version || '0.1.0' }}
          INPUT_IMAGE: ${{ needs.app-image.outputs.image }}
        run: |
          if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid manager version" }
          if ($env:INPUT_CBT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CBT version" }
          "version=$env:INPUT_VERSION" >> $env:GITHUB_OUTPUT
          "cbt_version=$env:INPUT_CBT_VERSION" >> $env:GITHUB_OUTPUT
          "image=$env:INPUT_IMAGE" >> $env:GITHUB_OUTPUT
      - name: Build standalone Manager with Nuitka
        id: manager
        shell: pwsh
        run: |
          $dist = & deployment/manager/build/build-manager.ps1 -Environment '${{ matrix.build_env }}' -ApiBaseUrl '${{ matrix.api_url }}' -WeaveImage '${{ steps.identity.outputs.image }}' -CbtVersion '${{ steps.identity.outputs.cbt_version }}' -ManagerVersion '${{ steps.identity.outputs.version }}' -OutputDirectory '${{ github.workspace }}\deployment\manager\build-output-${{ matrix.channel }}' | Select-Object -Last 1
          if (-not (Test-Path $dist)) { throw "Manager distribution not found: $dist" }
          "dist=$dist" >> $env:GITHUB_OUTPUT
      - name: Smoke test compiled Manager executable
        shell: pwsh
        run: |
          $exe = Join-Path '${{ steps.manager.outputs.dist }}' 'WeaveCBT-Manager.exe'
          if (-not (Test-Path $exe)) { throw "Compiled Manager executable not found: $exe" }

          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Compiled Manager self-test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            $bootstrapLog = Join-Path $env:PROGRAMDATA 'WeaveCBT\logs\bootstrap-error.log'
            if (Test-Path $bootstrapLog) {
              Write-Host '--- bootstrap-error.log ---'
              Get-Content $bootstrapLog
            }
            throw "Compiled Manager self-test failed with exit code $($process.ExitCode)."
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          $output = '${{ github.workspace }}\deployment\manager\installer-output-${{ matrix.channel }}'
          New-Item -ItemType Directory -Force $output | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=${{ steps.identity.outputs.version }}" "/DBuildChannel=${{ matrix.channel }}" "/DManagerDist=${{ steps.manager.outputs.dist }}" "/DRuntimeRootfs=${{ github.workspace }}\deployment\manager\runtime\distro\weave-runtime-rootfs.tar" "/DOutputDir=$output" 'deployment\manager\installer\WeaveCBT.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
      - name: Generate release metadata and SHA-256
        id: release
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || 'Weave CBT Manager 0.1.13 detects Public school networks, provides one-click trusted network approval, and automatically reconciles LAN forwarding when the host network changes.' }}
        run: |
          $output = '${{ github.workspace }}\deployment\manager\installer-output-${{ matrix.channel }}'
          $installer = Get-ChildItem $output -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not produced.' }
          $sha = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$sha  $($installer.Name)" | Set-Content (Join-Path $output 'SHA256SUMS.txt') -Encoding ASCII
          $installerUrl = 'https://github.com/${{ github.repository }}/releases/download/${{ matrix.release_tag }}/' + $installer.Name
          $manifest = [ordered]@{
            schema_version=1
            channel='${{ matrix.channel }}'
            manager_version='${{ steps.identity.outputs.version }}'
            cbt_version='${{ steps.identity.outputs.cbt_version }}'
            minimum_supported_version='0.1.0'
            image='${{ steps.identity.outputs.image }}'
            installer_asset=$installer.Name
            installer_url=$installerUrl
            installer_sha256=$sha
            release_notes=$env:RELEASE_NOTES
            source_commit='${{ github.sha }}'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $output 'release.json') -Encoding UTF8
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        with:
          name: weave-cbt-windows-${{ matrix.channel }}
          path: |
            deployment/manager/installer-output-${{ matrix.channel }}/*.exe
            deployment/manager/installer-output-${{ matrix.channel }}/SHA256SUMS.txt
            deployment/manager/installer-output-${{ matrix.channel }}/release.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish channel release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || 'Weave CBT Manager 0.1.13 detects Public school networks, provides one-click trusted network approval, and automatically reconciles LAN forwarding when the host network changes.' }}
        run: |
          $tag='${{ matrix.release_tag }}'
          $output='${{ github.workspace }}\deployment\manager\installer-output-${{ matrix.channel }}'
          $installer="$output\${{ steps.release.outputs.installer_name }}"
          $checksum="$output\SHA256SUMS.txt"
          $manifest="$output\release.json"
          $title="WEAVE CBT ${{ matrix.channel }} ${{ steps.identity.outputs.version }}"

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $installer $checksum $manifest --clobber
            if ($LASTEXITCODE -ne 0) { throw "Unable to upload assets to release $tag." }

            $editArgs = @('release', 'edit', $tag, '--title', $title, '--notes', $env:RELEASE_NOTES)
            if ('${{ matrix.channel }}' -eq 'staging') {
              $editArgs += '--prerelease'
            } else {
              $editArgs += '--latest'
            }
            gh @editArgs
            if ($LASTEXITCODE -ne 0) { throw "Unable to update release metadata for $tag." }
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f $tag '${{ github.sha }}'
          git push origin "refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0) { throw "Unable to create stable release tag $tag." }

          $createArgs = @(
            'release', 'create', $tag,
            $installer,
            $checksum,
            $manifest,
            '--verify-tag',
            '--title', $title,
            '--notes', $env:RELEASE_NOTES
          )
          if ('${{ matrix.channel }}' -eq 'staging') {
            $createArgs += '--prerelease'
          } else {
            $createArgs += '--latest'
          }
          gh @createArgs
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish release $tag." }
