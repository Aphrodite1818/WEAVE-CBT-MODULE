name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://weave:weave@127.0.0.1:5432/weave_cbt_test
      REDIS_URL: redis://127.0.0.1:6379/15
      ENVIRONMENT: dev
      DEBUG: 'false'
      IDENTITY_STORAGE_PATH: /tmp/weave-cbt/identity
      MEDIA_STORAGE_PATH: /tmp/weave-cbt/media
      BRANDING_LOGO_STORAGE_PATH: /tmp/weave-cbt/branding

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave_cbt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weave -d weave_cbt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install backend dependencies
        run: >-
          python -m pip install
          --requirement requirements.txt
          --requirement requirements-test.txt

      - name: Apply complete migration chain
        run: python -m alembic upgrade head

      - name: Verify migration head
        run: python -m alembic current

      - name: Run backend tests
        run: python -m pytest -v


  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build


  deployment-check:
    name: Deployment config checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: >-
          docker compose
          --env-file deployment/.env.example
          -f deployment/compose.yaml
          config --quiet

      - name: Validate Nginx configuration
        run: >-
          docker run --rm
          -v "${PWD}/deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:stable-alpine
          nginx -t


  publish-image:
    name: Build and publish WEAVE CBT image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/deployment-implementation' ||
      startsWith(github.ref, 'refs/tags/v')))
    needs: [backend-test, frontend-check, deployment-check]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=deployment-test,enable=${{ github.ref == 'refs/heads/deployment-implementation' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push WEAVE CBT image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
