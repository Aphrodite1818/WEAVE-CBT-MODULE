name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://weave:weave@127.0.0.1:5432/weave_cbt_test
      REDIS_URL: redis://127.0.0.1:6379/15
      DEBUG: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave_cbt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weave -d weave_cbt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Apply complete migration chain
        run: python -m alembic upgrade head

      - name: Verify migration head
        run: python -m alembic current

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deliver-artifacts:
    name: Stage delivery artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend delivery artifact
        working-directory: frontend
        run: npm run build

      - name: Stage frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

      - name: Stage backend source artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-source-${{ github.sha }}
          path: |
            backend/app
            backend/pyproject.toml
            backend/README.md
            backend/.python-version
          if-no-files-found: error
          retention-days: 14
