name: Generate initial CBT migration

on:
  workflow_dispatch:
  push:
    branches: [set-up]
    paths:
      - 'backend/app/**'
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - 'backend/pyproject.toml'
      - '.github/workflows/generate-initial-migration.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave_cbt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weave -d weave_cbt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://weave:weave@localhost:5432/weave_cbt
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Generate initial revision
        run: |
          mkdir -p alembic/versions
          rm -f alembic/versions/*.py
          alembic revision --autogenerate -m "initial schema"
      - name: Inspect generated migration
        run: |
          test "$(find alembic/versions -maxdepth 1 -name '*.py' | wc -l)" -eq 1
          cat alembic/versions/*.py
      - name: Apply initial migration
        run: alembic upgrade head
      - name: Verify model/migration parity
        run: alembic check
      - name: Upload generated revision
        uses: actions/upload-artifact@v7
        with:
          name: initial-alembic-revision
          path: backend/alembic/versions/*.py
          if-no-files-found: error
          retention-days: 3
