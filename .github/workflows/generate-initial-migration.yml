name: Generate initial CBT migration

on:
  workflow_dispatch:
  push:
    branches: [set-up]
    paths:
      - 'backend/app/**'
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - 'backend/pyproject.toml'
      - '.github/workflows/generate-initial-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave_cbt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weave -d weave_cbt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://weave:weave@localhost:5432/weave_cbt
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Generate and validate initial revision
        id: alembic
        shell: bash
        run: |
          mkdir -p alembic/versions
          rm -f alembic/versions/*.py
          set +e
          bash -o pipefail -c 'set -e; alembic revision --autogenerate -m "initial schema"; test "$(find alembic/versions -maxdepth 1 -name "*.py" | wc -l)" -eq 1; alembic upgrade head; alembic check' 2>&1 | tee alembic/migration-generation.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated initial revision
        if: steps.alembic.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alembic/versions/*.py
          git commit -m "db: add initial CBT schema migration"
          git push origin HEAD:set-up
      - name: Commit migration generation failure log
        if: steps.alembic.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f alembic/migration-generation.log
          git commit -m "ci: capture initial migration generation failure"
          git push origin HEAD:set-up
      - name: Fail generation job when Alembic validation failed
        if: steps.alembic.outputs.exit_code != '0'
        run: exit 1
