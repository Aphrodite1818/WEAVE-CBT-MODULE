services:
  # ==========================================================
  # PostgreSQL
  # Durable source of truth for WEAVE CBT
  # ==========================================================
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ==========================================================
  # Redis
  # Cache, coordination, rate limiting and ARQ jobs
  # ==========================================================
  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ==========================================================
  # Database migrations
  # Runs once before the API and worker are allowed to start.
  # ==========================================================
  migrate:
    image: ${WEAVE_IMAGE:?WEAVE_IMAGE is required}

    command:
      - /app/migrate/weave-cbt-migrate

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: prod
      DEBUG: "false"

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  # ==========================================================
  # WEAVE CBT API
  # Three replicas share PostgreSQL, Redis and weave_data.
  # ==========================================================
  api:
    image: ${WEAVE_IMAGE:?WEAVE_IMAGE is required}

    command:
      - /app/api/weave-cbt-api

    scale: 3

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: prod
      DEBUG: "false"

    volumes:
      - weave_data:/var/lib/weave-cbt

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped
    stop_grace_period: 30s


  # ==========================================================
  # ARQ Worker
  # ==========================================================
  worker:
    image: ${WEAVE_IMAGE:?WEAVE_IMAGE is required}

    command:
      - /app/worker/weave-cbt-worker

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: prod
      DEBUG: "false"

    volumes:
      - weave_data:/var/lib/weave-cbt

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped
    stop_grace_period: 30s


  # ==========================================================
  # Nginx
  # Only host-facing service. Load-balances the API replicas.
  # ==========================================================
  nginx:
    image: nginx:stable-alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


# ============================================================
# Persistent storage
# ============================================================
volumes:
  postgres_data:
  weave_data:
