services:
  # ==========================================================
  # PostgreSQL
  # Durable source of truth for WEAVE CBT
  # ==========================================================
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ==========================================================
  # Redis
  # Cache, coordination, rate limiting and ARQ jobs
  # ==========================================================
  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ==========================================================
  # Database migrations
  #
  # Uses the SAME WEAVE CBT image as the API and worker.
  # Runs once, upgrades PostgreSQL, then exits.
  # ==========================================================
  migrate:
    image: ${WEAVE_IMAGE}

    command:
      - /app/migrate/weave-cbt-migrate

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

      ENVIRONMENT: prod
      DEBUG: "false"

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  # ==========================================================
  # WEAVE CBT API
  #
  # Three containers are created from the same WEAVE image.
  # They all use the same PostgreSQL, Redis and persistent
  # WEAVE runtime storage.
  # ==========================================================
  api:
    image: ${WEAVE_IMAGE}

    command:
      - /app/api/weave-cbt-api

    scale: 3

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

      ENVIRONMENT: prod
      DEBUG: "false"

    volumes:
      - weave_data:/var/lib/weave-cbt

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  # ==========================================================
  # ARQ Worker
  #
  # Runs background jobs using the same application image.
  # ==========================================================
  worker:
    image: ${WEAVE_IMAGE}

    command:
      - /app/worker/weave-cbt-worker

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0

      ENVIRONMENT: prod
      DEBUG: "false"

    volumes:
      - weave_data:/var/lib/weave-cbt

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


  # ==========================================================
  # Nginx
  #
  # Public entrance to WEAVE CBT.
  # Requests are load-balanced across the API replicas.
  # ==========================================================
  nginx:
    image: nginx:stable-alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

    restart: unless-stopped


# ============================================================
# Persistent storage
# ============================================================
volumes:
  # PostgreSQL database survives container replacement.
  postgres_data:

  # WEAVE installation identity, media and branding survive
  # API/worker container replacement.
  weave_data: