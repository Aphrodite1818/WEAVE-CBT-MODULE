[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-cbt-manager"
version = "0.1.7"
description = "WEAVE CBT Windows deployment manager"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "PySide6>=6.8,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
