[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-cbt-manager"
version = "0.1.0"
description = "WEAVE CBT deployment manager"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
]

